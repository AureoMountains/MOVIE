
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-analysis"
version = "0.1.0"
description = "Movie dataset analysis"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
